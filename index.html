<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Playfair+Display:ital,wght@0,500;1,500&family=Lato:wght@400;700&display=swap">
<style>
:root{--bg:#fdf3f2;--card:#fff;--ink:#4a3a3f;--soft:#9a7f86;--rose:#d98c9b;--line:#f0d9dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#241a1e;--card:#33252b;--ink:#f6e6ea;--soft:#c9a5af;--rose:#e6a1b0;--line:#4a3640}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Lato',system-ui,sans-serif;line-height:1.6;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:16px 18px 80px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;margin:0}
a{color:inherit}
.back{display:inline-block;color:var(--soft);text-decoration:none;padding:8px 0;font-size:15px}
.hero{text-align:center;padding:30px 10px 20px}
.kicker{font-family:'Caveat',cursive;font-size:28px;color:var(--rose);margin:0}
.hero h1{font-size:clamp(40px,11vw,72px);font-style:italic;line-height:1.1}
.msg{max-width:460px;margin:14px auto 0;color:var(--soft);font-size:17px;white-space:pre-wrap}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:22px}
.tile{width:calc(50% - 7px);max-width:260px;aspect-ratio:1;border-radius:20px;background:linear-gradient(145deg,#f7c9d2,#e8a3b3) center/cover;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:14px;text-decoration:none;color:#fff;box-shadow:0 8px 20px rgba(217,140,155,.3);position:relative;border:0;font:inherit;cursor:pointer;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .em{font-size:44px;position:absolute;top:30%;left:0;right:0;text-align:center}
.tile .lb{font-family:'Playfair Display',Georgia,serif;font-size:18px;text-align:center;line-height:1.25;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.head{text-align:center;margin:10px 0 24px}.head h2{font-size:32px}.head p{color:var(--soft);margin:4px 0 0}
.btn{display:inline-block;background:var(--rose);color:#fff;border:0;border-radius:99px;padding:12px 26px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.center{text-align:center;padding:10px 0}
.env{background:var(--card);border:2px dashed var(--rose);border-radius:24px;padding:34px 40px;font:inherit;font-family:'Playfair Display',Georgia,serif;font-size:22px;color:var(--ink);cursor:pointer;box-shadow:0 8px 24px rgba(217,140,155,.2)}
.env b{display:block;font-size:56px;font-weight:400}
.big{font-family:'Caveat',cursive;font-size:30px;color:var(--rose);line-height:1.3}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 4px 18px rgba(217,140,155,.15)}
.card time{font-family:'Caveat',cursive;font-size:22px;color:var(--rose)}
.chip{float:right;background:var(--rose);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700}
.card h3{font-size:23px;margin:2px 0 6px}
.card p{margin:0;white-space:pre-wrap}
.card img,.sec img{width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin-top:12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.gal img{margin:0;aspect-ratio:1;max-height:none;cursor:pointer}
.sub{font-family:'Playfair Display',Georgia,serif;font-size:20px;margin:26px 0 12px;color:var(--soft)}
.lock{text-align:center;padding:30px 0}
.lock input{font:inherit;font-size:18px;text-align:center;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:12px 20px;width:min(300px,100%);margin:14px 0}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hint{color:var(--soft);font-size:14px;min-height:22px}
.sec p{white-space:pre-wrap;font-size:18px}
#modal{position:fixed;inset:0;background:rgba(40,20,28,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal.on{display:flex}
.mcard{background:var(--card);max-width:480px;width:100%;max-height:85vh;overflow:auto;border-radius:20px;padding:28px 24px 22px;text-align:center}
.mcard h3{font-size:26px;margin-bottom:10px}
.mcard .txt{font-family:'Caveat',cursive;font-size:27px;line-height:1.3;white-space:pre-wrap;margin:0 0 18px}
.empty{text-align:center;color:var(--soft);padding:30px 10px}
</style>
</head>
<body>
<main id="root"><p class="empty">Loading…</p></main>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=d=>{const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})};
const img=p=>p?`<img src="${esc(p)}" alt="" loading="lazy">`:'';
const gal=e=>{const p=[...(e.photos||[]),...(e.photo?[e.photo]:[])].filter(Boolean);const z=s=>`<img src="${esc(s)}" alt="" loading="lazy" data-act="zoom" data-src="${esc(s)}">`;return p.length===1?z(p[0]):p.length?'<div class="gal">'+p.map(z).join('')+'</div>':''};
let D={},last={};

const TILES=[['calendar','📅','A calendar of us'],['letter','💌','A letter from me'],['openwhen','🤍','Open when…'],['secret','🔒','A secret'],['collection','✨','Our collection']];
const MOODS=[['sad','😢','Open when you’re sad'],['mad','😠','Open when you’re mad'],['happy','😊','Open when you’re happy'],['tired','😴','Open when you’re tired'],['need','🤍','Open when you need me']];

const R={
home(){
  const S=D.site,t=S.tiles||{};
  return `<section class="hero"><p class="kicker">for</p><h1>${esc(S.to)}</h1><p class="msg">${esc(S.message)}</p></section><div class="tiles">`+
  TILES.map(([k,e,l])=>`<a class="tile" href="#${k}" style="${t[k]?`background-image:linear-gradient(transparent 40%,rgba(0,0,0,.55)),url('${esc(t[k])}')`:''}">${t[k]?'':`<span class="em">${e}</span>`}<span class="lb">${l}</span></a>`).join('')+'</div>';
},
calendar(){
  const now=new Date();now.setHours(0,0,0,0);
  const ev=D.calendar.map(e=>{const d=new Date(e.date+'T00:00:00');let days;
    if(e.yearly){const n=new Date(now.getFullYear(),d.getMonth(),d.getDate());if(n<now)n.setFullYear(n.getFullYear()+1);days=Math.round((n-now)/864e5)}
    else days=Math.round((d-now)/864e5);
    return{...e,days}});
  const card=e=>`<article class="card">${e.days>=0?`<span class="chip">${e.days===0?'Today! 🎉':'in '+e.days+' day'+(e.days>1?'s':'')}</span>`:''}<time>${esc(fmt(e.date))}${e.end?' – '+esc(fmt(e.end)):''}${e.yearly?' · every year':''}</time><h3>${esc(e.title)}</h3><p>${esc(e.text)}</p>${gal(e)}</article>`;
  const up=ev.filter(e=>e.days>=0).sort((a,b)=>a.days-b.days),past=ev.filter(e=>e.days<0).sort((a,b)=>b.days-a.days);
  return '<div class="head"><h2>A calendar of us</h2><p>The events that matter</p></div>'+
    (up.length?'<div class="sub">Coming up</div>'+up.map(card).join(''):'')+
    (past.length?'<div class="sub">Looking back</div>'+past.map(card).join(''):'')+
    (ev.length?'':'<p class="empty">No dates yet.</p>');
},
letter(){
  const L=D.letters,op=LS.get('opened',[]),isOp=l=>op.some(o=>o.text===l.text),n=L.filter(isOp).length;
  let h=`<div class="head"><h2>A letter from me</h2><p>${L.length?n+' of '+L.length+' opened':''}</p></div><div class="center">`;
  if(!L.length)h+='<p class="big">Letters are on their way…</p>';
  else if(n>=L.length)h+='<p class="big">You’ve opened every letter 💗<br>Come back soon for more.</p><p><a class="btn" href="#collection">See your collection</a></p>';
  else h+='<button class="env" data-act="letter"><b>💌</b>Open a letter</button>';
  return h+'</div>';
},
openwhen(){
  return '<div class="head"><h2>Open when…</h2><p>Pick the one that fits</p></div><div class="tiles">'+
  MOODS.map(([k,e,l])=>`<button class="tile" data-act="ow" data-k="${k}"><span class="em">${e}</span><span class="lb">${l}</span></button>`).join('')+'</div>';
},
secret(){
  const s=D.site.secret||{};
  if(LS.get('unlocked',false)){
    return `<div class="head"><h2>${esc(s.title||'Just for you')}</h2></div><div class="sec">`+(s.blocks||[]).map(b=>`${b.text?`<p>${esc(b.text)}</p>`:''}${img(b.photo)}`).join('')+'</div>';
  }
  return `<div class="head"><h2>A secret</h2></div><div class="lock" id="lock"><p class="big">What’s the magic word?</p><input id="pw" type="text" autocomplete="off" autocapitalize="none" placeholder="Enter the password"><div class="hint" id="hint">${esc(s.hint||'')}</div><button class="btn" data-act="unlock">Unlock</button></div>`;
},
collection(){
  const op=LS.get('opened',[]);
  return `<div class="head"><h2>Our collection</h2><p>${op.length?op.length+' letter'+(op.length>1?'s':'')+' collected':''}</p></div>`+
    (op.length?op.map(o=>`<article class="card"><h3>${esc(o.title)}</h3><p>${esc(o.text)}</p></article>`).join(''):'<p class="empty">Nothing here yet. Open a letter and it will be kept here forever.</p>');
}};

function render(){
  const k=R[location.hash.slice(1)]?location.hash.slice(1):'home';
  $('#root').innerHTML=(k==='home'?'':'<a class="back" href="#home">← Home</a>')+R[k]();
  window.scrollTo(0,0);
}
function modal(h){$('#modal').innerHTML=`<div class="mcard">${h}<button class="btn" data-act="close">Close</button></div>`;$('#modal').classList.add('on')}
const pick=(arr,key)=>{let i;do{i=Math.floor(Math.random()*arr.length)}while(arr.length>1&&i===last[key]);last[key]=i;return arr[i]};

document.addEventListener('click',e=>{
  const m=$('#modal');
  if(e.target===m){m.classList.remove('on');render();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='close'){m.classList.remove('on');render()}
  else if(a==='letter'){
    const op=LS.get('opened',[]),un=D.letters.filter(l=>!op.some(o=>o.text===l.text));
    if(!un.length){render();return}
    const l=un[Math.floor(Math.random()*un.length)];
    op.unshift({title:l.title||'A letter',text:l.text});LS.set('opened',op);
    modal(`<h3>${esc(l.title||'A letter')}</h3><p class="txt">${esc(l.text)}</p>`);
  }else if(a==='zoom'){modal(`<img src="${esc(b.dataset.src)}" alt="" style="width:100%;border-radius:12px;margin-bottom:16px">`)}
  else if(a==='ow'){
    const arr=D.openwhen[b.dataset.k]||[];
    modal(arr.length?`<p class="txt">${esc(pick(arr,b.dataset.k))}</p>`:'<p class="txt">No notes here yet. Check back soon.</p>');
  }else if(a==='unlock'){
    const s=D.site.secret||{},v=$('#pw').value.trim().toLowerCase();
    if(v&&v===String(s.password||'').trim().toLowerCase()){LS.set('unlocked',true);render()}
    else{const l=$('#lock');l.classList.remove('shake');void l.offsetWidth;l.classList.add('shake');$('#hint').textContent='Not quite, try again 💕'}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw')document.querySelector('[data-act="unlock"]').click()});
window.addEventListener('hashchange',()=>Object.keys(D).length&&render());

(async()=>{
  for(const f of ['site','calendar','letters','openwhen']){
    try{const r=await fetch(f+'.json?v='+Date.now());if(!r.ok)throw 0;D[f]=await r.json()}
    catch(err){$('#root').innerHTML=`<p class="empty">Couldn’t read <b>${f}.json</b>. If you just edited it, check for a missing comma or quotation mark.</p>`;return}
  }
  document.title=D.site.to?'For '+D.site.to:'For You';
  render();
})();
</script>
</body>
</html>
